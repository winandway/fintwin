<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinTwin — Receipts & Income</title>
<meta name="description" content="FinTwin keeps your company's income records in order. Coming soon.">
<link rel="icon" href="/icon.png">
<style>
  :root{color-scheme:light dark;--bg:#0b1220;--fg:#e8eefc;--muted:#93a3c4;--accent:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 16px;text-align:center}
  img{width:88px;height:88px;border-radius:20px}
  h1{margin:16px 0 4px;font-size:28px}
  p{margin:0;color:var(--muted);max-width:420px}
  .tag{margin-top:20px;display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font-size:13px;font-weight:600}
  footer{position:fixed;bottom:16px;font-size:12px;color:var(--muted)}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--fg)}
</style>
</head>
<body>
  <img src="/icon.png" alt="FinTwin">
  <h1>FinTwin</h1>
  <p>Receipts and income records for your business, read by AI and kept free of duplicates.</p>
  <span class="tag">Coming soon</span>
  <footer>© 2026 FinTwin | All rights reserved. Developed by <a href="https://windoce.com" target="_blank" rel="noopener noreferrer">Windoce LLC</a></footer>
