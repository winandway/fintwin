  <text x="795" y="517" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">Enviar</text>
  <circle cx="725" cy="512" r="13" fill="#e67e22"/><text x="725" y="517" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">3</text>

  <text x="30" y="517" font-size="12" fill="#c0392b" font-weight="700">NO TOCAR: «Cancelar envío» ni «Editar» la versión</text>
