  <rect x="660" y="24" width="210" height="34" rx="6" fill="#e5e5e5"/>
  <text x="765" y="46" font-size="12" text-anchor="middle" fill="#888">Volver a enviar a revisión de apps</text>
  <line x1="640" y1="20" x2="880" y2="62" stroke="#c0392b" stroke-width="3"/>
  <line x1="640" y1="62" x2="880" y2="20" stroke="#c0392b" stroke-width="3"/>
  <text x="765" y="82" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="700">NO TOCAR</text>

