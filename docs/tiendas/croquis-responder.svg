  <text x="50" y="402" font-size="12" fill="#e67e22">Pega aquí el texto en inglés del documento RESPUESTA-APPLE-4.3 (de «Hello App Review team» a «go@windoce.com»)</text>
  <text x="50" y="424" font-size="12" fill="#666">Sin adjuntos. Sin cambiar ni una palabra.</text>
  <circle cx="850" cy="370" r="13" fill="#e67e22"/><text x="850" y="375" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">2</text>

