  <circle cx="330" cy="305" r="13" fill="#e67e22"/><text x="330" y="310" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">1</text>

  <rect x="30" y="350" width="840" height="130" rx="8" fill="#fff" stroke="#e67e22" stroke-width="3"/>
