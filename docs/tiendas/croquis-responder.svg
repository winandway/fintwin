  <text x="50" y="152" font-size="12" fill="#444">Guidelines 4.3 - Spam and 4.2.6 - App Generation Services …</text>
  <text x="50" y="172" font-size="12" fill="#444">1. Describe in detail what this app does …  (nueve preguntas)</text>
  <line x1="50" y1="280" x2="850" y2="280" stroke="#ddd"/>
  <rect x="44" y="290" width="270" height="30" rx="6" fill="none" stroke="#e67e22" stroke-width="3"/>
